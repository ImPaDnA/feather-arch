name: Code Quality

# 1. Cuándo se activa: en cada push o pull request a la rama main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    # 2. La máquina virtual donde corre (en los servidores de GitHub, no en tu PC)
    runs-on: ubuntu-latest

    steps:
      # 3. Descarga una copia de tu repositorio
      - name: Check out repository
        uses: actions/checkout@v4

      # 4. Prepara el entorno con Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 5. Instala Ruff (el linter más rápido y liviano actual)
      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # 6. Escanea tu código en busca de errores y mala sintaxis
      - name: Run Ruff check
        run: ruff check src/
